# pi push relay. No secrets here: set them with `wrangler secret put` (see README.md).
name = "pi-push-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Use a custom domain in production if you like:
# routes = [{ pattern = "push.example.com", custom_domain = true }]

# Logs show request metadata only; the code never logs bodies, caps or tokens.
[observability]
enabled = false

# Workers rate limiting binding (Free plan). Counters are per Cloudflare location and approximate.
# namespace_id: any integer unique within your account.
[[ratelimits]]
name = "REGISTER_LIMIT"
namespace_id = "7101"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "SEND_LIMIT"
namespace_id = "7102"
  [ratelimits.simple]
  limit = 30
  period = 60
