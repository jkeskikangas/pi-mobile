# XcodeGen spec (plans/native-apps.md D10). `xcodegen` writes Pi.xcodeproj, which is not committed.
name: Pi
options:
  bundleIdPrefix: dev.pimobile
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    PI_BUNDLE_PREFIX: dev.pimobile
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    exactVersion: 0.11.0
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 154.0.0
targets:
  Pi:
    type: application
    platform: iOS
    sources:
      - path: Pi
      - path: Shared
    dependencies:
      - package: Sodium
      - package: WebRTC
      - target: PiWidgets
      - target: PiNotifications
    preBuildScripts:
      # Fallback copy of the shared voice logic (plans/native-apps.md D3); the hub's copy wins at run time.
      - name: Bundle voice-core.js
        script: mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" && cp "$SRCROOT/../../web/voice-core.js" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/voice-core.js"
        inputFiles: [$(SRCROOT)/../../web/voice-core.js]
        outputFiles: [$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/voice-core.js]
        basedOnDependencyAnalysis: true
    # Entitlements: Pi/App/Pi.entitlements (keychain group), or PiPush.entitlements when PI_PUSH=YES (below).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PI_BUNDLE_PREFIX).pi
        PRODUCT_NAME: Pi
        # Push needs a paid team: PI_PUSH=YES switches to PiPush.entitlements (aps-environment). README → Push.
        PI_PUSH: NO
        PI_ENTITLEMENTS_NO: Pi/App/Pi.entitlements
        PI_ENTITLEMENTS_YES: Pi/App/PiPush.entitlements
        CODE_SIGN_ENTITLEMENTS: $(PI_ENTITLEMENTS_$(PI_PUSH))
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: pi
      configs:
        Debug:
          PI_APS_ENVIRONMENT: development
        Release:
          PI_APS_ENVIRONMENT: production
    info:
      path: Pi/App/Info.plist
      properties:
        CFBundleDisplayName: pi
        PiKeychainGroup: $(AppIdentifierPrefix)$(PI_BUNDLE_PREFIX).shared
        # The APNs environment the entitlements use (PI_APS_ENVIRONMENT); the token's `sandbox` follows it.
        PiAPSEnvironment: $(PI_APS_ENVIRONMENT)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: pi listens while voice mode or dictation is on.
        NSCameraUsageDescription: Scan the pairing code shown by /remote on your computer.
        NSLocalNetworkUsageDescription: Reach pi on your computer.
        NSSupportsLiveActivities: true
        # The voice orb animates at 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        # Hubs are reached over the LAN or Tailscale on plain HTTP. Every payload is end-to-end
        # encrypted (secretbox), so the transport never sees plaintext. See README → ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
  PiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PiWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PI_BUNDLE_PREFIX).pi.widgets
        PRODUCT_NAME: PiWidgets
        SKIP_INSTALL: YES
    info:
      path: PiWidgets/Info.plist
      properties:
        CFBundleDisplayName: pi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PiNotifications:
    # Notification Service Extension: opens the sealed text of an APNs alert with the shared-Keychain device key.
    type: app-extension
    platform: iOS
    sources:
      - path: PiNotifications
      - path: Pi/Core/PushContent.swift
      - path: Pi/Core/Envelope.swift
      - path: Pi/Core/JSON.swift
      - path: Pi/Core/Keychain.swift
      - path: Pi/Core/Models.swift
    dependencies:
      - package: Sodium
    entitlements:
      path: PiNotifications/PiNotifications.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PI_BUNDLE_PREFIX).shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PI_BUNDLE_PREFIX).pi.notifications
        PRODUCT_NAME: PiNotifications
        SKIP_INSTALL: YES
    info:
      path: PiNotifications/Info.plist
      properties:
        CFBundleDisplayName: pi
        PiKeychainGroup: $(AppIdentifierPrefix)$(PI_BUNDLE_PREFIX).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  PiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PiTests
      - path: ../fixtures/crypto-vectors.json
        buildPhase: resources
    dependencies:
      - target: Pi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PI_BUNDLE_PREFIX).pi.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pi.app/Pi
        BUNDLE_LOADER: $(TEST_HOST)
  PiIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PiIntegrationTests]
    dependencies:
      - target: Pi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PI_BUNDLE_PREFIX).pi.integration
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pi.app/Pi
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Pi:
    build:
      targets:
        Pi: all
    test:
      gatherCoverageData: false
      targets: [PiTests, PiIntegrationTests]
    run:
      config: Debug
