<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="pi mobile">
<meta name="referrer" content="no-referrer">
<title>pi mobile</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
	<symbol id="i-chev-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
	<symbol id="i-chev-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
	<symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.2"/></symbol>
	<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
	<symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></symbol>
	<symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M5.5 12.5L12 19l6.5-6.5"/></symbol>
	<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" stroke="none"/></symbol>
	<symbol id="i-mic-off" viewBox="0 0 24 24"><path d="M15 10V6a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 5 2.2M5.5 11a6.5 6.5 0 0 0 11 4.7M18.5 11a6.5 6.5 0 0 1-.5 2.5M12 17.5V21M4 4l16 16"/></symbol>
	<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
	<symbol id="i-wave" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></symbol>
	<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/></symbol>
	<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></symbol>
	<symbol id="i-terminal" viewBox="0 0 24 24"><path d="M5 17l5-5-5-5M13 18h6"/></symbol>
	<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
	<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a13.5 13.5 0 0 1 0 18M12 3a13.5 13.5 0 0 0 0 18"/></symbol>
	<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol>
	<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
	<symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
	<symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.3L2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0zM12 9.5v4M12 17h.01"/></symbol>
	<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"/></symbol>
	<symbol id="i-compact" viewBox="0 0 24 24"><path d="M4 12h16M8 4l4 4 4-4M8 20l4-4 4 4"/></symbol>
	<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></symbol>
	<symbol id="i-voice" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 6a4 4 0 0 1 0 5M19.5 3.5a7.5 7.5 0 0 1 0 10"/></symbol>
	<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
	<symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/></symbol>
	<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
	<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
	<symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></symbol>
	<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
	<symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 4l1.6 4.9L18.5 10.5l-4.9 1.6L12 17l-1.6-4.9-4.9-1.6 4.9-1.6z"/></symbol>
	<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
	<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8.5 8.5"/></symbol>
	<symbol id="i-chip" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></symbol>
	<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
	<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M8 7.5l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
	<symbol id="i-qr" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2M20 14v6h-4M14 18v2"/></symbol>
</svg>
<div id="app">
	<header id="top">
		<button id="sessionBtn" class="session-btn" aria-haspopup="dialog">
			<span id="statusDot" class="dot" aria-hidden="true"></span>
			<span class="session-text">
				<span class="session-line"><span id="sessionName" class="session-name">pi mobile</span><svg class="i chev" aria-hidden="true"><use href="#i-chev-down"/></svg></span>
				<span id="sessionSub" class="session-sub"></span>
			</span>
			<span id="othersBadge" class="others" hidden></span>
		</button>
		<button id="modelBtn" class="model-btn" hidden></button>
		<button id="voiceBtn" class="icon-btn voice-btn" aria-label="Voice mode: talk with pi hands-free" title="Voice mode"><svg class="i" aria-hidden="true"><use href="#i-wave"/></svg></button>
		<button id="menuBtn" class="icon-btn" aria-label="Menu" aria-haspopup="dialog"><svg class="i" aria-hidden="true"><use href="#i-more"/></svg></button>
	</header>
	<div id="banner" class="banner" hidden role="status"></div>
	<button id="attention" class="attention" hidden></button>
	<div id="onboard" class="onboard" hidden>
		<button id="onboardYes" class="onboard-main">
			<span class="onboard-icon"><svg class="i" aria-hidden="true"><use href="#i-bell"/></svg></span>
			<span class="onboard-text"><b>Turn on notifications</b><span>When pi finishes or needs you</span></span>
		</button>
		<button id="onboardNo" class="icon-btn small" aria-label="Not now"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
	</div>
	<main id="scroller">
		<div id="empty" class="empty" hidden></div>
		<button id="olderBtn" class="older" hidden>Load earlier messages</button>
		<div id="transcript" aria-live="polite"></div>
		<div id="liveTools"></div>
	</main>
	<button id="jumpBtn" class="jump" hidden aria-label="Scroll to latest"><svg class="i" aria-hidden="true"><use href="#i-arrow-down"/></svg></button>
	<section id="prompts" aria-live="assertive"></section>
	<footer id="composer" hidden>
		<div id="workBar" class="work-bar" hidden>
			<span class="spinner" aria-hidden="true"></span>
			<span id="workText" class="work-text" role="status">Working</span>
			<div class="seg" role="group" aria-label="Your next message">
				<button id="modeSteer" aria-pressed="true" title="Interrupt after the current step">Steer</button>
				<button id="modeQueue" aria-pressed="false" title="Wait until pi finishes">Queue</button>
			</div>
			<button id="stopBtn" class="stop-btn" aria-label="Stop pi"><svg class="i" aria-hidden="true"><use href="#i-stop"/></svg><span class="label">Stop</span></button>
		</div>
		<div id="suggest" class="suggest" hidden role="listbox" aria-label="Commands"></div>
		<div id="attachments" class="attachments" hidden></div>
		<div id="dictBar" class="dict-bar" hidden aria-live="polite"></div>
		<div class="compose-box">
			<button id="attachBtn" class="icon-btn attach" aria-label="Attach image" title="Attach image"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
			<input id="fileInput" type="file" accept="image/*" multiple hidden>
			<textarea id="input" rows="1" placeholder="Message pi" enterkeyhint="send" autocomplete="off" aria-label="Message"></textarea>
			<button id="micBtn" class="icon-btn mic" aria-label="Dictate: hold to talk, or tap to start and stop" aria-pressed="false" title="Speak instead of typing: hold to talk, or tap to start and stop"><svg class="i" aria-hidden="true"><use href="#i-mic"/></svg></button>
			<button id="sendBtn" class="send" aria-label="Send"><svg class="i" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
		</div>
	</footer>
</div>
<div id="sheet" class="sheet" hidden>
	<div class="sheet-backdrop" data-close></div>
	<div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
		<div class="sheet-grip" data-close aria-hidden="true"></div>
		<div id="sheetBody"></div>
	</div>
</div>
<div id="voice" class="voice" hidden role="dialog" aria-modal="true" aria-label="Voice mode">
	<header class="v-top">
		<button id="vSession" class="session-btn v-session" aria-label="Switch session">
			<span id="vDot" class="dot" aria-hidden="true"></span>
			<span class="session-text">
				<span class="session-line"><span id="vSessionName" class="session-name"></span><svg class="i chev" aria-hidden="true"><use href="#i-chev-down"/></svg></span>
				<span id="vSub" class="session-sub"></span>
			</span>
		</button>
		<button id="vSettings" class="v-round" aria-label="Voice settings" aria-haspopup="dialog" title="Voice settings"><svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg></button>
	</header>
	<button id="vOrb" class="v-stage connecting" aria-describedby="vState vHint">
		<canvas id="vCanvas" class="v-canvas" aria-hidden="true"></canvas>
		<span class="v-icon" aria-hidden="true"></span>
		<span id="vState" class="v-state" aria-live="polite">Connecting…</span>
		<span id="vHint" class="v-hint"></span>
	</button>
	<section class="v-captions" aria-label="Conversation">
		<p id="vHeard" class="v-cap you"></p>
		<p id="vSaid" class="v-cap pi" aria-live="polite"></p>
	</section>
	<section id="vAsk" class="prompt v-ask" hidden aria-live="assertive"></section>
	<p id="vNote" class="v-note" role="status"></p>
	<footer class="v-controls">
		<button id="vMute" class="v-btn v-mute" aria-pressed="false">
			<span class="v-btn-face"><svg class="i on" aria-hidden="true"><use href="#i-mic"/></svg><svg class="i off" aria-hidden="true"><use href="#i-mic-off"/></svg></span>
			<span id="vMuteLabel" class="v-btn-label">Mute</span>
		</button>
		<button id="vEnd" class="v-btn v-end">
			<span class="v-btn-face"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></span>
			<span class="v-btn-label">End</span>
		</button>
	</footer>
	<audio id="vRemote" autoplay playsinline></audio>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="nacl.js"></script>
<script src="fleet.js"></script>
<script src="app.js"></script>
<script src="voice-core.js"></script>
<script src="voice.js"></script>
</body>
</html>
