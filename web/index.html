<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="pi mobile">
<meta name="referrer" content="no-referrer">
<title>pi mobile</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
	<header id="top">
		<button id="sessionBtn" class="session-btn" aria-haspopup="dialog" aria-label="Switch session">
			<span id="statusDot" class="dot"></span>
			<span class="session-text">
				<span id="sessionName" class="session-name">pi mobile</span>
				<span id="sessionSub" class="session-sub"></span>
			</span>
			<span class="chev" aria-hidden="true">▾</span>
		</button>
		<button id="modelBtn" class="chip" aria-label="Model and thinking level" hidden></button>
		<button id="voiceBtn" class="icon-btn voice-btn" aria-label="Voice mode: talk with pi hands-free" title="Voice mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg></button>
		<button id="menuBtn" class="icon-btn" aria-label="Menu">⋯</button>
	</header>
	<div id="banner" class="banner" hidden></div>
	<button id="attention" class="attention" hidden></button>
	<div id="onboard" class="onboard" hidden>
		<span>Get a notification when pi finishes or asks you something.</span>
		<button id="onboardYes" class="primary">Turn on</button>
		<button id="onboardNo">Not now</button>
	</div>
	<main id="scroller">
		<div id="empty" class="empty" hidden></div>
		<button id="olderBtn" class="older" hidden>Load earlier messages</button>
		<div id="transcript" aria-live="polite"></div>
		<div id="liveTools"></div>
	</main>
	<button id="jumpBtn" class="jump" hidden aria-label="Scroll to latest">↓</button>
	<section id="prompts" aria-live="assertive"></section>
	<footer id="composer" hidden>
		<div id="suggest" class="suggest" hidden></div>
		<div id="attachments" class="attachments" hidden></div>
		<div id="dictBar" class="dict-bar" hidden aria-live="polite"></div>
		<div class="compose-row">
			<label class="icon-btn attach" aria-label="Attach image">
				<span aria-hidden="true">＋</span>
				<input id="fileInput" type="file" accept="image/*" multiple hidden>
			</label>
			<textarea id="input" rows="1" placeholder="Message pi…" enterkeyhint="send" autocomplete="off"></textarea>
			<button id="modeBtn" class="mode" hidden title="While pi works: steer interrupts after the current tool, queue waits until it finishes">steer</button>
			<button id="stopBtn" class="stop" hidden aria-label="Stop">■</button>
			<button id="micBtn" class="icon-btn mic" aria-label="Dictate: hold to talk, or tap to start and stop" aria-pressed="false" title="Speak instead of typing: hold to talk, or tap to start and stop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
			<button id="sendBtn" class="send" aria-label="Send">↑</button>
		</div>
	</footer>
	<div id="viewOnly" class="view-only" hidden>View-only device</div>
</div>
<div id="sheet" class="sheet" hidden>
	<div class="sheet-backdrop" data-close></div>
	<div class="sheet-panel" role="dialog" aria-modal="true">
		<div class="sheet-grip" data-close></div>
		<div id="sheetBody"></div>
	</div>
</div>
<div id="voice" class="voice" hidden role="dialog" aria-modal="true" aria-label="Voice mode">
	<header class="v-top">
		<button id="vSession" class="v-session" aria-label="Switch session">
			<span id="vDot" class="dot"></span>
			<span id="vSessionName" class="v-name"></span>
			<span id="vEngine" class="v-engine"></span>
		</button>
		<button id="vEnd" class="v-close" aria-label="End voice mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
	</header>
	<button id="vOrb" class="v-stage connecting" aria-describedby="vState vHint">
		<canvas id="vCanvas" class="v-canvas" aria-hidden="true"></canvas>
		<span class="v-icon" aria-hidden="true"></span>
		<span id="vState" class="v-state" aria-live="polite">Connecting…</span>
		<span id="vHint" class="v-hint"></span>
	</button>
	<section class="v-captions" aria-label="Conversation">
		<p id="vHeard" class="v-cap you"></p>
		<p id="vSaid" class="v-cap pi" aria-live="polite"></p>
	</section>
	<section id="vAsk" class="v-ask" hidden aria-live="assertive"></section>
	<p id="vNote" class="v-note" role="status"></p>
	<footer class="v-controls">
		<button id="vMute" class="v-mute" aria-pressed="false" aria-label="Mute microphone">
			<svg class="on" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
			<svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 10V6a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 5 2.2M5 11a7 7 0 0 0 11.4 5.4M19 11a7 7 0 0 1-.6 2.8M12 18v3M4 4l16 16"/></svg>
		</button>
		<div class="v-seg" role="group" aria-label="How much to say">
			<button id="vEyesFree" aria-pressed="true" title="Shortest answers, nothing visual: driving, running, cycling">Eyes-free</button>
			<button id="vGlance" aria-pressed="false" title="A little more detail; you can look at the screen">Can glance</button>
		</div>
		<div class="v-seg" role="group" aria-label="How turns work">
			<button id="vOpen" aria-pressed="true" title="Just talk; pi notices when you're done">Open mic</button>
			<button id="vTap" aria-pressed="false" title="Tap the circle to talk and again when done: wind, traffic, noise">Tap to talk</button>
		</div>
	</footer>
	<audio id="vRemote" autoplay playsinline></audio>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="nacl.js"></script>
<script src="app.js"></script>
<script src="voice-core.js"></script>
<script src="voice.js"></script>
</body>
</html>
